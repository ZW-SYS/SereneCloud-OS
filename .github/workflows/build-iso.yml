name: 构建 ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "构建完成后发布到 Releases（预发布）"
        type: boolean
        default: false

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间（构建需要 ~25 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      - name: 检查包名
        run: python3 tools/check-packages.py

      - name: 用 live-build 构建（Debian 13 容器）
        run: |
          sudo docker run --rm --privileged -v "$PWD":/build -w /build debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
              grub-efi-amd64-bin grub-pc-bin mtools dosfstools syslinux syslinux-common isolinux ca-certificates zstd
            lb clean --purge || true
            lb config
            lb build
          '
          sudo chown -R "$(id -u):$(id -g)" .
          ls -lh *.iso
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.1-dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          mkdir -p out
          mv *.iso "out/SereneCloud-OS-${VERSION}-amd64.iso"
          (cd out && sha256sum *.iso > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: QEMU 启动测试
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf socat xorriso imagemagick
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          tests/boot-test.sh out/*.iso test-out

      - name: 录制演示视频（开机 → 桌面 → 打开软件）
        continue-on-error: true
        run: |
          sudo apt-get install -y ffmpeg
          tests/demo-video.sh out/*.iso demo-out

      - name: 上传演示视频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: demo-out/
          if-no-files-found: ignore

      - name: 更新「CI 预览」（截图和视频，方便检查）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-preview
          name: CI 预览：最新一次自动测试的截图和演示视频
          prerelease: true
          make_latest: false
          body: "这里只放自动测试的截图和演示视频（每次推送 main 自动更新），不是正式版本。下载系统请看正式的 v* 版本。"
          files: |
            demo-out/*
            test-out/*.png

      - name: 上传测试截图和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: test-out/

      - name: 上传 ISO
        uses: actions/upload-artifact@v4
        with:
          name: SereneCloud-OS-${{ env.VERSION }}-amd64
          path: out/
          compression-level: 0
          retention-days: 14

      - name: 切分 ISO（GitHub Releases 单个文件上限 2 GB）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          cd out
          ISO=$(ls *.iso)
          if [ "$(stat -c%s "$ISO")" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$ISO" "$ISO.part"
            rm "$ISO"
            sha256sum *.part* >> SHA256SUMS
          fi
          ls -lh

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          name: SereneCloud OS ${{ env.VERSION }}
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            out/*
            test-out/*.png
            docs/videos/SereneCloud-OS-demo.mp4
